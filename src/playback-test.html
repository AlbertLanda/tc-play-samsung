<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TC Play · Prueba local</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; background: #0b1020; color: white; font: 24px Arial, sans-serif; overflow: hidden; }
    main { padding: 24px 4%; }
    h1 { margin: 0 0 12px; font-size: 32px; }
    p { margin: 8px 0; }
    video { display: block; margin: 16px auto; width: 720px; height: 480px; max-width: 100%; object-fit: contain; background: black; }
    body.large video { width: 100%; height: 65vh; }
    button { background: #172239; color: white; border: 2px solid #46d8fa; font: inherit; padding: 12px 20px; margin-right: 15px; }
    button:focus { outline: 4px solid #46d8fa; background: #254568; }
    #report { font-size: 16px; white-space: pre-wrap; height: 160px; overflow: auto; }
  </style>
</head>
<body>
  <main>
    <h1>TC Play · Prueba local de reproducción</h1>
    <p>20 segundos. El cuadro debe moverse sin pausas y el tono debe sonar continuo.</p>
    <p>El archivo está incluido en la app: esta prueba no usa internet ni solicita tu cuenta.</p>
    <video id="test-video" preload="auto" playsinline src="assets/playback-test.mp4"></video>
    <button id="start-test">Iniciar / repetir</button>
    <button id="size-test">Cambiar tamaño</button>
    <button id="report-test">Mostrar diagnóstico</button>
    <p id="test-status">Presiona Iniciar / repetir.</p>
    <pre id="report"></pre>
  </main>
  <script src="playback-test.js"></script>
</body>
</html>
